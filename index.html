<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NZXT Video Local Player</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }

    .config-container {
      padding: 20px;
      max-width: 500px;
      margin: 80px auto;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 10px;
    }

    .config-title {
      color: #00ff88;
      font-size: 22px;
      margin-bottom: 20px;
      text-align: center;
    }

    .file-input {
      width: 100%;
      padding: 10px;
      background: #2a2a3e;
      border: 2px solid #00ff88;
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00cc6a;
      transform: translateY(-2px);
    }

    /* Kraken fullscreen */
    .kraken-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-player {
      width: 100%;
      height: 100%;
      object-fit: cover; /* luôn fill toàn bộ */
    }

    /* Circle mask cho AIO */
    .circle-mask {
      width: 100vw;
      height: 100vh;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #888;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin { 
      0% { transform: rotate(0deg);} 
      100% { transform: rotate(360deg);} 
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    class NZXTVideoPlayer {
      constructor() {
        this.isKraken = false;
        this.deviceShape = "rectangle";
        this.currentVideoUrl = null;
        this.init();
      }

      init() {
        const searchParams = new URLSearchParams(window.location.search);
        this.isKraken = searchParams.get("kraken") === "1";

        if (window.nzxt && window.nzxt.v1) {
          this.deviceShape = window.nzxt.v1.shape || "rectangle";
        }

        this.setupUI();
        this.setupStorageListener();
        this.loadSavedVideo();
      }

      setupUI() {
        const app = document.getElementById("app");

        if (this.isKraken) {
          app.innerHTML = this.getKrakenHTML();
        } else {
          app.innerHTML = this.getConfigHTML();
          this.setupConfigListeners();
        }
      }

      getConfigHTML() {
        return `
          <div class="config-container">
            <h1 class="config-title">NZXT Video Local Player</h1>
            <input type="file" id="videoFile" class="file-input" accept="video/*"/>
            <div class="controls">
              <button id="playBtn" class="btn">Send to Kraken</button>
              <button id="clearBtn" class="btn">Clear</button>
            </div>
            <div id="status" style="text-align:center;margin-top:15px;color:#666;"></div>
          </div>
        `;
      }

      getKrakenHTML() {
        const maskClass = this.deviceShape === "circle" ? "circle-mask" : "";
        return `
          <div class="kraken-container ${maskClass}">
            ${this.currentVideoUrl ? 
              `<video id="krakenVideo" class="video-player" autoplay loop muted>
                 <source src="${this.currentVideoUrl}" type="video/mp4">
               </video>` :
              `<div class="loading">
                 <div class="spinner"></div>
                 <p>Waiting for video...</p>
               </div>`
            }
          </div>
        `;
      }

      setupConfigListeners() {
        const fileInput = document.getElementById("videoFile");
        const playBtn = document.getElementById("playBtn");
        const clearBtn = document.getElementById("clearBtn");
        const status = document.getElementById("status");

        fileInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) {
            const url = URL.createObjectURL(file);
            localStorage.setItem("nzxt-video-url", url);
            status.textContent = `Selected: ${file.name}`;
          }
        });

        playBtn.addEventListener("click", () => {
          const url = localStorage.getItem("nzxt-video-url");
          if (url) {
            localStorage.setItem("nzxt-video-action", "play");
            status.textContent = "Video sent to Kraken!";
          } else {
            status.textContent = "Please select a video file first.";
          }
        });

        clearBtn.addEventListener("click", () => {
          localStorage.removeItem("nzxt-video-url");
          localStorage.setItem("nzxt-video-action", "clear");
          status.textContent = "Video cleared.";
          fileInput.value = "";
        });
      }

      setupStorageListener() {
        if (this.isKraken) {
          window.addEventListener("storage", () => this.handleVideoUpdate());
        }
      }

      loadSavedVideo() {
        if (this.isKraken) {
